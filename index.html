<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaber Talaat Mohamed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 20px;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .title {
            color: #888;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .social-icons a {
            width: 50px;
            height: 50px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            text-decoration: none;
            transition: 0.3s;
        }
        .social-icons a:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .whatsapp:hover { background: #25D366 !important; }
        .facebook:hover { background: #1877F2 !important; }
        .instagram:hover { background: #E4405F !important; }
        .telegram:hover { background: #0088cc !important; }
        .snapchat:hover { background: #FFFC00 !important; color: #000 !important; }
    </style>
</head>
<body>
    <div class="container">
        <img src="gaber.jpg" alt="Gaber Talaat" class="profile-img">
        <h1>Gaber Talaat Mohamed</h1>
        <p class="title">Content Creator | Social Media Specialist</p>
        
        <div class="social-icons">
            <a href="https://wa.me/201140748597" target="_blank" class="whatsapp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="https://www.facebook.com/share/18abG5c7zP/" target="_blank" class="facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/g.t.m_27?igsh=MWFmam52aGRsdTcydQ==" target="_blank" class="instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://t.me/GTM_MEDIA2" target="_blank" class="telegram">
                <i class="fab fa-telegram"></i>
            </a>
            <a href="https://www.snapchat.com/add/gtmm_27?share_id=4oVL3tMID5o&locale=ar-AA" target="_blank" class="snapchat">
                <i class="fab fa-snapchat"></i>
            </a>
        </div>
    </div>
</body>
</html>
